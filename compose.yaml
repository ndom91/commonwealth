services:
  app:
    build: .
    environment:
      DATABASE_URL: ${COMPOSE_DATABASE_URL:-postgres://team_kb:team_kb@postgres:5432/team_kb}
      OLLAMA_URL: ${COMPOSE_OLLAMA_URL:-http://ollama:11434}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL}
      PORT: 3000
      MAX_REQUEST_BYTES: ${MAX_REQUEST_BYTES:-15000000}
    depends_on:
      postgres:
        condition: service_healthy
      ollama-init:
        condition: service_completed_successfully
      markitdown:
        condition: service_healthy
    volumes:
      - source_data:/app/storage
    ports:
      - "127.0.0.1:${HOST_PORT:-3000}:3000"

  admin:
    build:
      context: .
      dockerfile: admin/Dockerfile
    environment:
      DATABASE_URL: ${COMPOSE_DATABASE_URL:-postgres://team_kb:team_kb@postgres:5432/team_kb}
      BETTER_AUTH_URL: ${BETTER_AUTH_URL}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET}
      # Editing a source rewrites its chunks, so the admin now embeds too. It
      # must resolve to the same Ollama and the same model as `app`: chunks from
      # two models in one index do not error, they quietly stop matching.
      OLLAMA_URL: ${COMPOSE_OLLAMA_URL:-http://ollama:11434}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL}
      PORT: 3001
    depends_on:
      admin-migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      ollama-init:
        condition: service_completed_successfully
    # The same volume `app` mounts. Uploaded originals are addressed by content
    # hash, so both services must look in one place or each sees only its own.
    volumes:
      - source_data:/app/storage
    ports:
      - "127.0.0.1:${ADMIN_PORT:-3001}:3001"

  admin-migrate:
    build:
      context: .
      dockerfile: admin/Dockerfile
    command: ["pnpm", "migrate"]
    environment:
      DATABASE_URL: ${COMPOSE_DATABASE_URL:-postgres://team_kb:team_kb@postgres:5432/team_kb}
      BETTER_AUTH_URL: ${BETTER_AUTH_URL}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET}
      BOOTSTRAP_ADMIN_NAME: ${BOOTSTRAP_ADMIN_NAME}
      BOOTSTRAP_ADMIN_EMAIL: ${BOOTSTRAP_ADMIN_EMAIL}
      BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL}
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_DB: team_kb
      POSTGRES_USER: team_kb
      POSTGRES_PASSWORD: team_kb
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U team_kb -d team_kb"]
      interval: 5s
      timeout: 5s
      retries: 10
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  ollama:
    image: ollama/ollama:latest
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 5s
      timeout: 5s
      retries: 24
    volumes:
      - ollama_data:/root/.ollama
    # Published on loopback so `pnpm dev` on the host can embed. Without this the
    # admin dev server can only reach Ollama by the compose hostname, which does
    # not resolve outside the network — so revising a source failed with a bare
    # "failed to fetch" and nothing to point at.
    ports:
      - "127.0.0.1:${OLLAMA_PORT:-11434}:11434"

  ollama-init:
    image: ollama/ollama:latest
    environment:
      OLLAMA_HOST: ollama:11434
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-qwen3-embedding:0.6b}
    depends_on:
      ollama:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c", "for attempt in $$(seq 1 60); do ollama list && exec ollama pull $${EMBEDDING_MODEL}; sleep 2; done; echo 'Ollama was not ready after 120 seconds' >&2; exit 1"]
    restart: "no"

  markitdown:
    build: ./markitdown
    cpus: 1.0
    mem_limit: 1g
    pids_limit: 128
    healthcheck:
      test: ["CMD", "python", "-c", "from urllib.request import urlopen; urlopen('http://localhost:8000/health')"]
      interval: 5s
      timeout: 5s
      retries: 12

  caddy:
    image: caddy:2-alpine
    profiles: ["public"]
    environment:
      CADDY_DOMAIN: ${CADDY_DOMAIN:-localhost}
    depends_on:
      app:
        condition: service_started
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  postgres_data:
  ollama_data:
  caddy_data:
  caddy_config:
  source_data:
