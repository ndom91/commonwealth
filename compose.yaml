services:
  app:
    build:
      context: .
      dockerfile: mcp-server/Dockerfile
    environment:
      DATABASE_URL: ${COMPOSE_DATABASE_URL:-postgres://team_kb:team_kb@postgres:5432/team_kb}
      OLLAMA_URL: ${COMPOSE_OLLAMA_URL:-http://ollama:11434}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL}
      CORPUS_PATH: ${COMPOSE_CORPUS_PATH:-/app/corpora}
      # Paired with EMBEDDING_MODEL above, and only correct for it.
      # qwen3-embedding is asymmetric: queries want `Instruct: …\nQuery: …`,
      # documents want raw text. Only this service embeds queries — the web app
      # embeds documents and searches lexically, so it takes no instruction.
      # Change the model and this has to change or be removed with it.
      EMBEDDING_QUERY_INSTRUCTION: ${EMBEDDING_QUERY_INSTRUCTION:-Given a question from a teammate, retrieve passages from the team knowledge base that answer it}
      PORT: 3000
      MAX_REQUEST_BYTES: ${MAX_REQUEST_BYTES:-15000000}
      # Containers publish only to loopback, so no proxy is assumed by default.
      # Set this true only when a trusted reverse proxy forwards client addresses.
      TRUST_FORWARDED_FOR: ${APP_TRUST_FORWARDED_FOR:-false}
    depends_on:
      postgres:
        condition: service_healthy
      ollama-init:
        condition: service_completed_successfully
    volumes:
      - corpus_data:/app/corpora
    ports:
      - "127.0.0.1:${HOST_PORT:-3000}:3000"

  web:
    build:
      context: .
      dockerfile: web/Dockerfile
    environment:
      DATABASE_URL: ${COMPOSE_DATABASE_URL:-postgres://team_kb:team_kb@postgres:5432/team_kb}
      BETTER_AUTH_URL: ${BETTER_AUTH_URL}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET}
      # Editing a source rewrites its chunks, so the web app now embeds too. It
      # must resolve to the same Ollama and the same model as `app`: chunks from
      # two models in one index do not error, they quietly stop matching.
      OLLAMA_URL: ${COMPOSE_OLLAMA_URL:-http://ollama:11434}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL}
      CORPUS_PATH: ${COMPOSE_CORPUS_PATH:-/app/corpora}
      PORT: 3001
      # This service is bound to loopback with nothing in front of it by default.
      # Set it true — and configure better-auth's `trustedProxies` — if
      # you put a proxy here, otherwise the invitation limiter counts every
      # caller in the world as one.
      TRUST_FORWARDED_FOR: ${WEB_TRUST_FORWARDED_FOR:-false}
    depends_on:
      web-migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      ollama-init:
        condition: service_completed_successfully
    volumes:
      - corpus_data:/app/corpora
    ports:
      - "127.0.0.1:${WEB_PORT:-3001}:3001"

  web-migrate:
    build:
      context: .
      dockerfile: web/Dockerfile
    command: ["pnpm", "migrate"]
    environment:
      DATABASE_URL: ${COMPOSE_DATABASE_URL:-postgres://team_kb:team_kb@postgres:5432/team_kb}
      BETTER_AUTH_URL: ${BETTER_AUTH_URL}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET}
      BOOTSTRAP_ADMIN_NAME: ${BOOTSTRAP_ADMIN_NAME}
      BOOTSTRAP_ADMIN_EMAIL: ${BOOTSTRAP_ADMIN_EMAIL}
      BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL}
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_DB: team_kb
      POSTGRES_USER: team_kb
      POSTGRES_PASSWORD: team_kb
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U team_kb -d team_kb"]
      interval: 5s
      timeout: 5s
      retries: 10
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  ollama:
    image: ollama/ollama:latest
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 5s
      timeout: 5s
      retries: 24
    volumes:
      - ollama_data:/root/.ollama
    # Published on loopback so `pnpm dev` on the host can embed. Without this the
    # web dev server can only reach Ollama by the compose hostname, which does
    # not resolve outside the network — so revising a source failed with a bare
    # "failed to fetch" and nothing to point at.
    ports:
      - "127.0.0.1:${OLLAMA_PORT:-11434}:11434"

  ollama-init:
    image: ollama/ollama:latest
    environment:
      OLLAMA_HOST: ollama:11434
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-qwen3-embedding:0.6b}
    depends_on:
      ollama:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c", "for attempt in $$(seq 1 60); do ollama list && exec ollama pull $${EMBEDDING_MODEL}; sleep 2; done; echo 'Ollama was not ready after 120 seconds' >&2; exit 1"]
    restart: "no"

volumes:
  postgres_data:
  ollama_data:
  corpus_data:
