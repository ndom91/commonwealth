services:
  app:
    build:
      context: .
      dockerfile: mcp-server/Dockerfile
    environment:
      DATABASE_URL: ${COMPOSE_DATABASE_URL:-postgres://team_kb:team_kb@postgres:5432/team_kb}
      EMBEDDING_URL: ${COMPOSE_EMBEDDING_URL:-http://inference:8080}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-qwen3-embedding-0.6b-q8_0-370f27d}
      CORPUS_PATH: ${COMPOSE_CORPUS_PATH:-/app/corpora}
      # Paired with EMBEDDING_MODEL above, and only correct for it.
      # qwen3-embedding is asymmetric: queries want `Instruct: …\nQuery: …`,
      # documents want raw text. The web app's retrieval inspector uses this same
      # instruction for queries while continuing to embed documents without it.
      # Change the model and this has to change or be removed with it.
      EMBEDDING_QUERY_INSTRUCTION: ${EMBEDDING_QUERY_INSTRUCTION:-Given a question from a teammate, retrieve passages from the team knowledge base that answer it}
      PORT: 3000
      MAX_REQUEST_BYTES: ${MAX_REQUEST_BYTES:-15000000}
      # Containers publish only to loopback, so no proxy is assumed by default.
      # Set this true only when a trusted reverse proxy forwards client addresses.
      TRUST_FORWARDED_FOR: ${APP_TRUST_FORWARDED_FOR:-false}
      FORWARDED_IP_HEADER: ${APP_FORWARDED_IP_HEADER:-x-forwarded-for}
    depends_on:
      postgres:
        condition: service_healthy
      inference:
        condition: service_healthy
    volumes:
      - corpus_data:/app/corpora
    ports:
      - "127.0.0.1:${HOST_PORT:-3000}:3000"

  web:
    build:
      context: .
      dockerfile: web/Dockerfile
    environment:
      DATABASE_URL: ${COMPOSE_DATABASE_URL:-postgres://team_kb:team_kb@postgres:5432/team_kb}
      BETTER_AUTH_URL: ${BETTER_AUTH_URL}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET}
      # Editing a source rewrites its chunks, so the web app now embeds too. It
      # must resolve to the same embedding service and model as `app`: chunks from
      # two models in one index do not error, they quietly stop matching.
      EMBEDDING_URL: ${COMPOSE_EMBEDDING_URL:-http://inference:8080}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-qwen3-embedding-0.6b-q8_0-370f27d}
      EMBEDDING_QUERY_INSTRUCTION: ${EMBEDDING_QUERY_INSTRUCTION:-Given a question from a teammate, retrieve passages from the team knowledge base that answer it}
      CORPUS_PATH: ${COMPOSE_CORPUS_PATH:-/app/corpora}
      PORT: 3001
      # This service is bound to loopback with nothing in front of it by default.
      # Set it true — and configure better-auth's `trustedProxies` — if
      # you put a proxy here, otherwise the invitation limiter counts every
      # caller in the world as one.
      TRUST_FORWARDED_FOR: ${WEB_TRUST_FORWARDED_FOR:-false}
      FORWARDED_IP_HEADER: ${WEB_FORWARDED_IP_HEADER:-x-forwarded-for}
    depends_on:
      web-migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      inference:
        condition: service_healthy
    volumes:
      - corpus_data:/app/corpora
    ports:
      - "127.0.0.1:${WEB_PORT:-3001}:3001"

  web-migrate:
    build:
      context: .
      dockerfile: web/Dockerfile
    command: ["pnpm", "migrate"]
    environment:
      DATABASE_URL: ${COMPOSE_DATABASE_URL:-postgres://team_kb:team_kb@postgres:5432/team_kb}
      BETTER_AUTH_URL: ${BETTER_AUTH_URL}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET}
      BOOTSTRAP_ADMIN_NAME: ${BOOTSTRAP_ADMIN_NAME}
      BOOTSTRAP_ADMIN_EMAIL: ${BOOTSTRAP_ADMIN_EMAIL}
      BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-qwen3-embedding-0.6b-q8_0-370f27d}
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_DB: team_kb
      POSTGRES_USER: team_kb
      POSTGRES_PASSWORD: team_kb
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U team_kb -d team_kb"]
      interval: 5s
      timeout: 5s
      retries: 10
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  inference:
    build:
      context: ./inference
      args:
        LLAMA_CPP_IMAGE: ghcr.io/ggml-org/llama.cpp:server@sha256:100de626bdc5b7df898c12561eefaf557019d2746d5fc8d3f4d7fd24e15ad384
    environment:
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-qwen3-embedding-0.6b-q8_0-370f27d}
      MODEL_FILE: ${MODEL_FILE:-Qwen3-Embedding-0.6B-Q8_0.gguf}
      MODEL_POOLING: ${MODEL_POOLING:-last}
      MODEL_SHA256: ${MODEL_SHA256:-06507c7b42688469c4e7298b0a1e16deff06caf291cf0a5b278c308249c3e439}
      MODEL_URL: ${MODEL_URL:-https://huggingface.co/Qwen/Qwen3-Embedding-0.6B-GGUF/resolve/370f27d7550e0def9b39c1f16d3fbaa13aa67728/Qwen3-Embedding-0.6B-Q8_0.gguf}
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/health"]
      interval: 5s
      timeout: 5s
      retries: 24
      start_period: 10m
    volumes:
      - embedding_models:/models
    # Published on loopback so `pnpm dev` on the host can embed. Without this the
    # web dev server can only reach the inference service by the compose hostname,
    # which does not resolve outside the network.
    ports:
      - "127.0.0.1:${EMBEDDING_PORT:-8080}:8080"

volumes:
  postgres_data:
  embedding_models:
  corpus_data:
